<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মক্তব ডায়েরি - নূরানী কায়দা শিক্ষক গাইড</title>
  
  <!-- FontAwesome CDN Link for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Master Bundle Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">

  <!-- Master Entry Point Script -->
  <script type="module" src="./js/app.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>    
    <!-- Left Sidebar Toggle Button -->
    <button class="icon-btn" id="sidebar-toggle-btn" aria-label="Toggle Navigation Menu">
      <i class="fas fa-list-ul"></i>
    </button>
    
    <!-- Dynamic Page Title -->
    <h1 id="page-title">পার্ট ১: ক্লাসের সূচনা, বসার আদব ও দিক পরিচিতি</h1>
    
    <!-- Right Action Buttons Group -->
    <div class="header-actions">
      <!-- Settings Button (First) -->
      <button class="icon-btn" id="settings-btn" aria-label="Settings">
        <i class="fas fa-cog"></i>
      </button>

      <!-- Right Sidebar Toggle Button (At the very right) -->
      <button class="icon-btn" id="right-sidebar-toggle-btn" aria-label="Toggle Page Index">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </header>
  
  <!-- Main Application Container -->
  <div class="app-container">
    
    <!-- Left Navigation Sidebar -->
    <nav class="sidebar-left" id="sidebarLeft">
      <div class="sidebar-title">কোর্স সূচিপত্র</div>
      <ul class="nav-list">
        <!-- Dynamic menu items will render here -->
      </ul>
    </nav>

    <!-- Main Content Display Area -->
    <main class="main-content" id="mainContent"></main>

    <!-- Right Navigation Sidebar -->
    <aside class="sidebar-right" id="sidebarRight">
      <div class="sidebar-title">এই পাঠের অংশসমূহ</div>
      <ul class="nav-list" id="rightSidebarNav">
        <!-- Dynamic table of contents will render here -->
      </ul>
    </aside>

  </div>

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Settings modal will be injected dynamically by settings.js -->

</body>
</html>
